name: Update Clear Ranking Leaderboard

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  update-ranking:
    if: contains(github.event.issue.labels.*.name, 'clear-ranking')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate and merge ranking entry
        id: merge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          node - <<'EOF'
          const fs = require('node:fs');

          function fnv1aHex(str) {
            let h = 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h.toString(16).padStart(8, '0');
          }

          function computeSignature(e) {
            const sec10 = Math.round(e.elapsedSec * 10);
            const raw = `shinjuku-0047|${e.id}|${e.name}|${sec10}|${e.difficulty}|${e.notesRead}|${e.chasesSurvived}|${e.coinsTossed}`;
            return fnv1aHex(raw);
          }

          function sanitizeName(name) {
            return String(name || '')
              .replace(/[\u0000-\u001f\u007f<>`]/g, '')
              .trim()
              .slice(0, 16);
          }

          const body = process.env.ISSUE_BODY || '';
          const m = body.match(/```json\s*([\s\S]*?)```/);
          if (!m) {
            console.log('No JSON block found in issue body.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'valid=false\nreason=JSON形式の記録データが見つかりませんでした。\n');
            process.exit(0);
          }

          let data;
          try {
            data = JSON.parse(m[1]);
          } catch {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'valid=false\nreason=JSONの解析に失敗しました。\n');
            process.exit(0);
          }

          const name = sanitizeName(data.name) || sanitizeName(process.env.ISSUE_USER) || '脱出者';
          const elapsedSec = Number(data.elapsedSec);
          const difficulty = data.difficulty === 'nightmare' ? 'nightmare' : data.difficulty === 'normal' ? 'normal' : null;
          const notesRead = Math.max(0, Math.min(8, Math.floor(Number(data.notesRead) || 0)));
          const totalNotes = 8;
          const chasesSurvived = Math.max(0, Math.min(99, Math.floor(Number(data.chasesSurvived) || 0)));
          const coinsTossed = Math.max(0, Math.min(99, Math.floor(Number(data.coinsTossed) || 0)));
          const id = String(data.id || `gh-${process.env.ISSUE_NUMBER}`).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40);

          if (!difficulty || !Number.isFinite(elapsedSec) || elapsedSec < 25 || elapsedSec > 7200) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'valid=false\nreason=クリアタイムまたは難易度の値が不正です。\n');
            process.exit(0);
          }

          const entry = {
            id,
            name,
            elapsedSec: Math.round(elapsedSec * 10) / 10,
            difficulty,
            notesRead,
            totalNotes,
            chasesSurvived,
            coinsTossed,
            clearedAt: process.env.ISSUE_CREATED_AT || new Date().toISOString(),
          };

          const expectedSig = computeSignature(entry);
          if (data.sig && data.sig !== expectedSig) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'valid=false\nreason=記録の検証署名（checksum）が一致しませんでした。\n');
            process.exit(0);
          }

          const rootPath = 'rankings.json';
          const publicPath = 'app/public/rankings.json';
          let current = { version: 1, updatedAt: new Date().toISOString(), entries: [] };
          if (fs.existsSync(rootPath)) {
            try {
              current = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
            } catch {}
          }
          const list = Array.isArray(current.entries) ? current.entries : [];
          const idx = list.findIndex((x) => x.id === entry.id);
          if (idx >= 0) list[idx] = entry;
          else list.push(entry);

          list.sort((a, b) => {
            if (a.elapsedSec !== b.elapsedSec) return a.elapsedSec - b.elapsedSec;
            if (a.difficulty !== b.difficulty) return a.difficulty === 'nightmare' ? -1 : 1;
            if ((b.notesRead || 0) !== (a.notesRead || 0)) return (b.notesRead || 0) - (a.notesRead || 0);
            return String(a.clearedAt).localeCompare(String(b.clearedAt));
          });

          const trimmed = list.slice(0, 100);
          const rank = trimmed.findIndex((x) => x.id === entry.id) + 1;
          const out = {
            version: 1,
            updatedAt: new Date().toISOString(),
            entries: trimmed,
          };
          const jsonStr = JSON.stringify(out, null, 2) + '\n';
          fs.writeFileSync(rootPath, jsonStr);
          fs.writeFileSync(publicPath, jsonStr);

          const mm = String(Math.floor(entry.elapsedSec / 60)).padStart(2, '0');
          const ss = String(Math.floor(entry.elapsedSec % 60)).padStart(2, '0');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `valid=true\nrank=${rank}\ntotal=${trimmed.length}\ntime=${mm}:${ss}\nname=${entry.name}\n`
          );
          EOF

      - name: Commit and push updated rankings.json
        if: steps.merge.outputs.valid == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rankings.json app/public/rankings.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ranking): add clear record #${{ github.event.issue.number }} (${{ steps.merge.outputs.time }})"
            git push
          fi

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const valid = '${{ steps.merge.outputs.valid }}' === 'true';
            if (valid) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🏆 **オンライン全体ランキングに登録されました！**\n\n- プレイヤー名: **${{ steps.merge.outputs.name }}**\n- クリアタイム: **${{ steps.merge.outputs.time }}**\n- 現在の全体順位: **${{ steps.merge.outputs.rank }}位** / ${{ steps.merge.outputs.total }}人\n\n数十秒ほどでゲームのクリア画面ランキングに自動反映されます。脱出おめでとうございます！`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ ランキング登録をスキップしました: ${{ steps.merge.outputs.reason }}`
              });
            }
